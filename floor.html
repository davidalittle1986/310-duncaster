<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Floor Plan — 310 Duncaster</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="310 Duncaster" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
  <style>
    /* Vector plan layout: dark-mode filter on wrapper only (not on inline SVG groups) */
    .fp-plan-layer {
      position: absolute; inset: 0;
      filter: var(--fp-filter);
      -webkit-filter: var(--fp-filter);
    }
    .fp-plan-layer svg, .fp-overlay { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .fp-overlay { pointer-events: none; touch-action: none; }
    .fp-plan-svg { touch-action: none; }
  </style>
</head>
<body>
  <div class="loader" id="loader">
    <div class="loader-inner">
      <div class="loader-title">310 Duncaster</div>
      <div class="loader-bar"><div class="loader-fill" id="loader-fill"></div></div>
    </div>
  </div>

  <div class="floor-page page-enter" id="floor-page" style="opacity:0">
    <nav class="nav-bar">
      <div class="nav-crumb">
        <a href="index.html">Home</a>
        <span class="nav-sep">›</span>
        <span id="floor-title">—</span>
      </div>
      <div class="nav-right">
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light or dark mode">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="measure-toggle" id="measure-toggle">Measure</button>
      </div>
    </nav>
    <div class="nav-page-title" id="floor-title-large">—</div>

    <div class="floorplan-wrapper" id="fp-wrapper">
      <div class="fp-plan-layer">
        <svg class="fp-plan-svg" id="plan-svg" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" preserveAspectRatio="xMidYMid meet">
          <g id="plan-content"></g>
        </svg>
      </div>
      <svg class="fp-overlay" id="overlay-svg" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
        <g id="hotspot-layer"></g>
        <g id="measure-layer"></g>
      </svg>
      <p class="hotspot-hint" id="hotspot-hint">Tap a room to view construction photos</p>
    </div>

    <div class="measure-bar" id="measure-bar">
      <div class="measure-readout" id="measure-readout">Pinch to zoom · drag to measure</div>
      <div class="measure-actions">
        <button class="measure-btn" id="clear-btn">Clear</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/config.js"></script>
  <script>
    const NS = 'http://www.w3.org/2000/svg';
    const floorKey = location.hash.slice(1) || 'downstairs';
    const floor    = SITE.floors[floorKey];
    if (!floor) location.href = 'index.html';

    // Per-floor vector plan + crop viewBox in the SVG's native point coords
    const PLAN = {
      downstairs: { svg: 'images/downstairs-floorplan.svg', vb: [486.5, 128.5, 1333, 1457] },
      upstairs:   { svg: 'images/upstairs-floorplan.svg',   vb: [486.0, 289.5, 1192, 1313] }
    }[floorKey];
    const BASE = { x: PLAN.vb[0], y: PLAN.vb[1], w: PLAN.vb[2], h: PLAN.vb[3] };
    let vb = { ...BASE };

    document.title = `${floor.label} — 310 Duncaster`;
    document.getElementById('floor-title').textContent       = floor.label;
    document.getElementById('floor-title-large').textContent = floor.label;

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
    });

    const planSvg = document.getElementById('plan-svg');
    const overSvg = document.getElementById('overlay-svg');
    const planG   = document.getElementById('plan-content');
    const hotG    = document.getElementById('hotspot-layer');
    const measG   = document.getElementById('measure-layer');
    const loader  = document.getElementById('loader');
    const loaderFill = document.getElementById('loader-fill');
    const page    = document.getElementById('floor-page');

    function applyVB() {
      const vbStr = `${vb.x} ${vb.y} ${vb.w} ${vb.h}`;
      planSvg.setAttribute('viewBox', vbStr);
      overSvg.setAttribute('viewBox', vbStr);
    }
    applyVB();

    // ── Load vector plan ────────────────────────────────────────
    loaderFill.style.width = '25%';
    fetch(PLAN.svg).then(r => r.text()).then(txt => {
      loaderFill.style.width = '70%';
      const inner = txt.replace(/^[\s\S]*?<svg[^>]*>/, '').replace(/<\/svg>\s*$/, '');
      planG.innerHTML = inner;
      buildHotspots();
      loaderFill.style.width = '100%';
      setTimeout(() => {
        loader.style.opacity = '0'; loader.style.pointerEvents = 'none';
        page.style.opacity = '1'; page.style.transition = 'opacity 0.4s';
        setTimeout(() => loader.style.display = 'none', 400);
      }, 200);
    }).catch(err => { loader.querySelector('.loader-title').textContent = 'Failed to load plan'; });

    // Scale (feet per SVG point) — verified on both floors
    const VECTOR_SCALES = { downstairs: 0.064516, upstairs: 0.055675 };
    function getScale() { return VECTOR_SCALES[floorKey]; }

    // ── Hotspots ────────────────────────────────────────────────
    function u(rx, ry) { return { x: BASE.x + (rx / 1000) * BASE.w, y: BASE.y + (ry / 1000) * BASE.h }; }
    const HOT_R = BASE.w * 0.032, HOT_F = BASE.w * 0.0135;
    function buildHotspots() {
      floor.rooms.forEach(room => {
        const p = u(room.x, room.y);
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', 'hotspot-group'); g.style.pointerEvents = 'auto';
        const c = document.createElementNS(NS, 'circle');
        c.setAttribute('class', 'hotspot-circle');
        c.setAttribute('cx', p.x); c.setAttribute('cy', p.y); c.setAttribute('r', HOT_R);
        const t = document.createElementNS(NS, 'text');
        t.setAttribute('class', 'hotspot-label');
        t.setAttribute('x', p.x); t.setAttribute('y', p.y); t.setAttribute('font-size', HOT_F);
        t.textContent = room.label;
        g.appendChild(c); g.appendChild(t); hotG.appendChild(g);
        g.addEventListener('click', () => { if (!measureMode) navigateToRoom(room); });
      });
    }

    function navigateToRoom(room) {
      const p = u(room.x, room.y);
      animateVB({ x: p.x - BASE.w * 0.12, y: p.y - BASE.h * 0.12, w: BASE.w * 0.24, h: BASE.h * 0.24 }, 500, () => {
        location.href = `gallery.html#${floorKey}/${room.id}`;
      });
    }
    function animateVB(target, dur, done) {
      const start = { ...vb }, t0 = performance.now();
      function step(now) {
        const k = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - k, 3);
        vb.x = start.x + (target.x - start.x) * e;
        vb.y = start.y + (target.y - start.y) * e;
        vb.w = start.w + (target.w - start.w) * e;
        vb.h = start.h + (target.h - start.h) * e;
        applyVB();
        if (k < 1) requestAnimationFrame(step); else if (done) done();
      }
      requestAnimationFrame(step);
    }

    // ── Measure mode ────────────────────────────────────────────
    let measureMode = false;
    const measureToggle = document.getElementById('measure-toggle');
    const readout = document.getElementById('measure-readout');
    const hint    = document.getElementById('hotspot-hint');
    const toast   = document.getElementById('toast');
    measureToggle.addEventListener('click', () => {
      measureMode = !measureMode;
      document.body.classList.toggle('measuring', measureMode);
      measureToggle.classList.toggle('active', measureMode);
      measureToggle.textContent = measureMode ? 'Done' : 'Measure';
      hint.textContent = measureMode ? 'Pinch to zoom · drag one finger to measure' : 'Tap a room to view construction photos';
      updateReadout();
    });
    function updateReadout(msg) { readout.textContent = msg || 'Pinch to zoom · drag to measure'; }
    function showToast(m) { toast.textContent = m; toast.classList.add('active'); setTimeout(() => toast.classList.remove('active'), 2400); }
    document.getElementById('clear-btn').addEventListener('click', () => {
      [...measG.querySelectorAll('*')].forEach(n => n.remove()); updateReadout();
    });

    // Explicit screen→user mapping (doesn't depend on getScreenCTM, which iOS
    // Safari may not update synchronously after a viewBox change — that was
    // making the pinch focal-point stale, causing "zoom-from-center" behavior).
    // Matches SVG preserveAspectRatio="xMidYMid meet".
    function toUser(cx, cy) {
      const r = planSvg.getBoundingClientRect();
      const s = Math.min(r.width / vb.w, r.height / vb.h);
      const offX = (r.width  - vb.w * s) / 2;
      const offY = (r.height - vb.h * s) / 2;
      return { x: vb.x + (cx - r.left - offX) / s,
               y: vb.y + (cy - r.top  - offY) / s };
    }
    function fmt(ft) { let f = Math.floor(ft), i = Math.round((ft - f) * 12); if (i === 12) { f++; i = 0; } return `${f}' ${i}"`; }

    let drawing = false, startPt = null, curLine = null, curEnds = [], lastDist = 0;
    function beginDraw(cx, cy) {
      startPt = toUser(cx, cy); drawing = true; lastDist = 0;
      curLine = document.createElementNS(NS, 'line');
      curLine.setAttribute('class', 'm-line');
      curLine.setAttribute('x1', startPt.x); curLine.setAttribute('y1', startPt.y);
      curLine.setAttribute('x2', startPt.x); curLine.setAttribute('y2', startPt.y);
      measG.appendChild(curLine);
      curEnds = [0, 1].map(() => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('class', 'm-end'); c.setAttribute('r', BASE.w * 0.005); c.setAttribute('cx', startPt.x); c.setAttribute('cy', startPt.y); measG.appendChild(c); return c; });
    }
    function moveDraw(cx, cy) {
      if (!drawing) return;
      const p = toUser(cx, cy);
      curLine.setAttribute('x2', p.x); curLine.setAttribute('y2', p.y);
      curEnds[1].setAttribute('cx', p.x); curEnds[1].setAttribute('cy', p.y);
      lastDist = Math.hypot(p.x - startPt.x, p.y - startPt.y);
      updateReadout(fmt(lastDist * getScale()));
    }
    function endDraw() {
      if (!drawing) return; drawing = false;
      if (lastDist < BASE.w * 0.004) { curLine.remove(); curEnds.forEach(c => c.remove()); return; }
      const mx = (parseFloat(curLine.getAttribute('x1')) + parseFloat(curLine.getAttribute('x2'))) / 2;
      const my = (parseFloat(curLine.getAttribute('y1')) + parseFloat(curLine.getAttribute('y2'))) / 2;
      const t = document.createElementNS(NS, 'text');
      t.setAttribute('class', 'm-label'); t.setAttribute('x', mx); t.setAttribute('y', my);
      t.setAttribute('font-size', vb.w * 0.030); t.textContent = fmt(lastDist * getScale());
      measG.appendChild(t);
    }
    function cancelDraw() { if (!drawing) return; drawing = false; curLine.remove(); curEnds.forEach(c => c.remove()); }

    // ── Gestures ─────────────────────────────────────────────────
    const wrapper = document.getElementById('fp-wrapper');
    let gesture = null, lastPinchDist = 0, grabUser = null, pinchAnchorUser = null;
    const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
    function clampVB() {
      const minW = BASE.w / 12, maxW = BASE.w;
      vb.w = clamp(vb.w, minW, maxW); vb.h = vb.w * (BASE.h / BASE.w);
      const mx = BASE.w * 0.12, my = BASE.h * 0.12;
      vb.x = clamp(vb.x, BASE.x - mx, BASE.x + BASE.w - vb.w + mx);
      vb.y = clamp(vb.y, BASE.y - my, BASE.y + BASE.h - vb.h + my);
    }
    function startPinch(e) {
      gesture = 'pinch'; if (drawing) cancelDraw();
      const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2;
      const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      lastPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      pinchAnchorUser = toUser(midX, midY);
    }
    wrapper.addEventListener('touchstart', e => {
      if (e.touches.length === 2) { e.preventDefault(); startPinch(e); }
      else if (e.touches.length === 1) {
        if (measureMode) { gesture = 'draw'; beginDraw(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); }
        else { gesture = 'pan'; grabUser = toUser(e.touches[0].clientX, e.touches[0].clientY); }
      }
    }, { passive: false });
    wrapper.addEventListener('touchmove', e => {
      if (gesture === 'pinch' && e.touches.length === 2) {
        e.preventDefault();
        const mid = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
        const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        // 1. Zoom by the change in finger distance
        const f = dist / lastPinchDist;
        vb.w /= f; vb.h /= f;
        // 2. Translate so the anchor point (user coord under previous mid) is
        //    now under the current mid. This handles focal-point zoom AND
        //    two-finger panning in one step — content follows the fingers.
        const under = toUser(mid.x, mid.y);
        vb.x += pinchAnchorUser.x - under.x;
        vb.y += pinchAnchorUser.y - under.y;
        clampVB(); applyVB();
        // Save for next move — where the anchor actually landed (accounts for clamp).
        lastPinchDist = dist;
        pinchAnchorUser = toUser(mid.x, mid.y);
      } else if (gesture === 'draw' && e.touches.length === 1) {
        e.preventDefault(); moveDraw(e.touches[0].clientX, e.touches[0].clientY);
      } else if (gesture === 'pan' && e.touches.length === 1) {
        e.preventDefault();
        const cur = toUser(e.touches[0].clientX, e.touches[0].clientY);
        vb.x += grabUser.x - cur.x; vb.y += grabUser.y - cur.y; clampVB(); applyVB();
      }
    }, { passive: false });
    wrapper.addEventListener('touchend', e => {
      if (gesture === 'draw') endDraw();
      if (e.touches.length === 0) gesture = null;
      else if (e.touches.length === 1 && gesture === 'pinch') { gesture = measureMode ? null : 'pan'; if (gesture === 'pan') grabUser = toUser(e.touches[0].clientX, e.touches[0].clientY); }
      else if (e.touches.length === 2 && gesture !== 'pinch') { startPinch(e); }
    }, { passive: true });

    let lastTap = 0;
    wrapper.addEventListener('touchend', e => {
      if (measureMode || e.changedTouches.length !== 1 || gesture === 'draw') return;
      const now = Date.now();
      if (now - lastTap < 300) {
        const p = toUser(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
        if (vb.w < BASE.w * 0.9) animateVB({ ...BASE }, 260);
        else animateVB({ x: p.x - BASE.w * 0.17, y: p.y - BASE.h * 0.17, w: BASE.w * 0.34, h: BASE.h * 0.34 }, 260);
        lastTap = 0;
      } else lastTap = now;
    }, { passive: true });

    // Back-swipe (only when fully zoomed out and not measuring)
    let backX = 0;
    document.addEventListener('touchstart', e => { backX = e.touches[0].clientX; }, { passive: true });
    document.addEventListener('touchend', e => {
      if (measureMode || Math.abs(vb.w - BASE.w) > 1) return;
      const dx = e.changedTouches[0].clientX - backX;
      if (dx > 80 && backX < 40) history.back();
    }, { passive: true });

    // Mouse (desktop)
    wrapper.addEventListener('mousedown', e => { if (measureMode) { gesture = 'draw'; beginDraw(e.clientX, e.clientY); } else { gesture = 'pan'; grabUser = toUser(e.clientX, e.clientY); } });
    wrapper.addEventListener('mousemove', e => { if (gesture === 'draw' && drawing) moveDraw(e.clientX, e.clientY); else if (gesture === 'pan' && grabUser) { const c = toUser(e.clientX, e.clientY); vb.x += grabUser.x - c.x; vb.y += grabUser.y - c.y; clampVB(); applyVB(); } });
    window.addEventListener('mouseup', () => { if (gesture === 'draw') endDraw(); gesture = null; grabUser = null; });
    wrapper.addEventListener('wheel', e => {
      e.preventDefault();
      const before = toUser(e.clientX, e.clientY);
      const f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
      vb.w /= f; vb.h /= f; clampVB(); applyVB();
      const after = toUser(e.clientX, e.clientY);
      vb.x += before.x - after.x; vb.y += before.y - after.y; clampVB(); applyVB();
    }, { passive: false });
  </script>
</body>
</html>
