<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>310 Duncaster — Construction Reference</title>
  <link rel="stylesheet" href="css/style.css" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="310 Duncaster" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <script>document.documentElement.dataset.theme = localStorage.getItem('theme') || 'dark';</script>
</head>
<body>
  <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light or dark mode">
    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>

  <main class="home page-enter">
    <header class="home-header">
      <h1>310 Duncaster</h1>
      <p>Construction Reference</p>
    </header>

    <div class="floor-cards">
      <div class="floor-card" onclick="goFloor('downstairs')" role="button" tabindex="0">
        <img src="images/downstairs-floorplan.jpg" alt="Downstairs floor plan" loading="lazy" />
        <div class="floor-card-label">
          <h2>Downstairs</h2>
          <span>10 Rooms</span>
        </div>
        <div class="floor-card-arrow">→</div>
      </div>

      <div class="floor-card" onclick="goFloor('upstairs')" role="button" tabindex="0">
        <img src="images/upstairs-floorplan.jpg" alt="Upstairs floor plan" loading="lazy" />
        <div class="floor-card-label">
          <h2>Upstairs</h2>
          <span>13 Rooms</span>
        </div>
        <div class="floor-card-arrow">→</div>
      </div>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script>
    function goFloor(floor) {
      window.location.href = `floor.html#${floor}`;
    }
    // Keyboard nav
    document.querySelectorAll('.floor-card').forEach(card => {
      card.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ' ') card.click();
      });
    });
    // Theme toggle
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const next = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light';
      document.documentElement.dataset.theme = next;
      localStorage.setItem('theme', next);
    });
  </script>
</body>
</html>
