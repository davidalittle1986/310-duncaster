<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>310 Duncaster — 3D Home</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="310 3D" />
  <meta name="theme-color" content="#f4f1ea" />
  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" />
  <link rel="stylesheet" href="css/viewer.css" />
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('viewerTheme') || 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Password gate (viewer only) -->
  <div id="gate" class="gate" hidden>
    <form id="gate-form" class="gate-card" autocomplete="off">
      <h1>310 Duncaster</h1>
      <p class="gate-sub">3D Home</p>
      <input id="gate-input" type="password" placeholder="Password" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="go" />
      <button type="submit">Enter</button>
      <p id="gate-error" class="gate-error" aria-live="polite"></p>
    </form>
  </div>

  <div id="app" class="app" hidden>
    <div id="stage" class="stage"></div>

    <header class="topbar">
      <div class="bar-row">
        <nav class="seg seg-main" aria-label="Section">
          <button type="button" class="on" aria-current="page">3D Home</button>
          <a href="index.html">Construction Photos</a>
        </nav>
        <button id="theme-btn" class="icon-btn" type="button" aria-label="Toggle light or dark mode">
          <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
      <div class="bar-row bar-controls">
        <div class="seg" id="mode-seg" role="tablist" aria-label="View mode">
          <button type="button" data-mode="overall" class="on">Overall</button>
          <button type="button" data-mode="plan">Plan</button>
          <button type="button" data-mode="walk">Walk</button>
        </div>
        <div class="seg" id="floor-seg" aria-label="Floor">
          <button type="button" data-floor="1" class="on">1st</button>
          <button type="button" data-floor="2">2nd</button>
        </div>
        <label class="rooms-pick">
          <span id="rooms-label">Rooms</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 9l6 6 6-6"/></svg>
          <select id="rooms-select" aria-label="Go to room"></select>
        </label>
      </div>
    </header>

    <div id="hint" class="hint" hidden>Tap to walk · Drag to look</div>
    <div id="loading" class="loading">Loading…</div>
  </div>

  <script type="module" src="js/viewer/main.js"></script>
</body>
</html>
